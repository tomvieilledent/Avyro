<!doctype html>
<html lang="fr" class="h-full m-0">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiche entreprise — Avyro</title>
    <link rel="icon" href="assets/mark-training.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dist/styles.css" />
  </head>
  <body class="h-full m-0 bg-[#f8fafc]">
    <header
      class="fixed top-0 left-0 w-full h-[60px] z-30 flex items-center justify-between px-6 bg-[#1e3a8a] [box-shadow:0_2px_12px_rgba(15,23,62,0.22)]"
    >
      <a
        href="dashboard.html"
        class="text-white text-lg font-bold tracking-[-0.02em] no-underline flex items-center gap-2"
      >
        <img src="assets/mark-training.svg" alt="" class="h-7 w-7" />
        Avyro
      </a>
      <a
        href="javascript:history.back()"
        class="inline-flex items-center border border-white/40 text-white bg-transparent rounded-[7px] py-[5px] px-[13px] text-[0.8125rem] font-medium cursor-pointer transition-[background] duration-150 no-underline hover:bg-white/[0.12]"
        >← Retour</a
      >
    </header>

    <main class="pt-20 max-w-[900px] mx-auto pb-12 px-6">
      <div id="loading" class="text-sm text-gray-500">Chargement…</div>

      <div id="content" class="hidden">
        <div class="card mb-6">
          <div class="flex items-center justify-between flex-wrap gap-4">
            <div>
              <h1 id="co-name" class="text-2xl font-bold text-gray-900"></h1>
              <p id="co-kind" class="mt-1 text-sm text-gray-500"></p>
            </div>
            <div>
              <a
                id="co-email"
                href="#"
                class="inline-flex items-center border border-[#1d4ed8] text-avyro-600 bg-[#eff6ff] rounded-[7px] py-[5px] px-[13px] text-[0.8125rem] font-medium no-underline"
                >Contacter</a
              >
            </div>
          </div>
        </div>

        <h2 class="text-lg font-semibold mt-6 mb-3">Formations disponibles</h2>
        <div id="trainings-list" class="content-list"></div>
        <p id="no-trainings" class="text-sm text-gray-500 hidden">Aucune formation disponible.</p>

        <h2 class="text-lg font-semibold mt-6 mb-3">Salles disponibles</h2>
        <div id="rooms-list" class="content-list"></div>
        <p id="no-rooms" class="text-sm text-gray-500 hidden">Aucune salle disponible.</p>
      </div>
    </main>

    <script src="src/api.js"></script>
    <script>
      const companyId = new URLSearchParams(location.search).get("id");
      if (!companyId) location.href = "dashboard.html";

      const fmtDate = (s) =>
        new Date(s).toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });

      function renderItem(t, listId) {
        const list = document.getElementById(listId);
        const el = document.createElement("div");
        el.className = "card flex items-center justify-between gap-3";
        el.innerHTML = `
          <div class="min-w-0 flex-1">
            <h3 class="font-semibold">${t.title}</h3>
            <p class="text-sm text-gray-500 mt-0.5">${fmtDate(t.starts_at)} · ${t.is_remote ? "À distance" : t.location || "—"}</p>
            <p class="text-sm text-gray-600 mt-1">${t.available_seats} place(s) · ${t.price_per_seat} €/place</p>
          </div>
          <a href="dashboard.html" class="btn-primary shrink-0 text-[0.8125rem] px-[14px] py-[6px]">Réserver</a>`;
        list.appendChild(el);
      }

      (async () => {
        try {
          const data = await Avyro.api(`/companies/${companyId}/offerings`);
          document.getElementById("loading").style.display = "none";
          document.getElementById("content").classList.remove("hidden");

          document.getElementById("co-name").textContent = data.company.name;
          document.getElementById("co-kind").textContent =
            data.company.kind === "pro" ? "Entreprise" : "Particulier";
          const emailLink = document.getElementById("co-email");
          if (data.company.contact_email) {
            emailLink.href = "mailto:" + data.company.contact_email;
            emailLink.textContent = "Contacter";
          } else {
            emailLink.style.display = "none";
          }

          if (data.trainings.length) data.trainings.forEach((t) => renderItem(t, "trainings-list"));
          else document.getElementById("no-trainings").classList.remove("hidden");

          if (data.rooms.length) data.rooms.forEach((r) => renderItem(r, "rooms-list"));
          else document.getElementById("no-rooms").classList.remove("hidden");
        } catch (e) {
          document.getElementById("loading").textContent = "Entreprise introuvable.";
        }
      })();
    </script>
  </body>
</html>
