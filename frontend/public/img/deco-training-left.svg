<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700" role="img" aria-label="Formation — vue gauche">
  <defs>
    <radialGradient id="tl-light" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#f0f6ff"/>
      <stop offset="0.6" stop-color="#dde8f5"/>
      <stop offset="1" stop-color="#c4d0e0"/>
    </radialGradient>
    <linearGradient id="tl-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdd6e2"/>
      <stop offset="1" stop-color="#b0bccb"/>
    </linearGradient>
    <linearGradient id="tl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ec5f0"/>
      <stop offset="0.8" stop-color="#d8ecfb"/>
      <stop offset="1" stop-color="#eef5fd"/>
    </linearGradient>
    <linearGradient id="tl-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="tl-screen" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#3b5a8c"/>
      <stop offset="1" stop-color="#1c2c46"/>
    </radialGradient>
    <linearGradient id="tl-table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#cdd6e1"/>
    </linearGradient>
    <linearGradient id="tl-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa6b6"/>
      <stop offset="1" stop-color="#7c8898"/>
    </linearGradient>
    <linearGradient id="tl-overlay" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.42"/>
    </linearGradient>
    <radialGradient id="tl-vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0.44"/>
    </radialGradient>
    <filter id="tl-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="tl-softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="tl-win"><rect x="20" y="55" width="360" height="155" rx="3"/></clipPath>
  </defs>

  <rect x="0" y="0" width="400" height="520" fill="url(#tl-light)"/>
  <rect x="0" y="498" width="400" height="12" fill="#b8c2cf"/>
  <rect x="0" y="510" width="400" height="190" fill="url(#tl-floor)"/>
  <rect x="0" y="510" width="400" height="80" fill="#ffffff" opacity="0.08"/>

  <g clip-path="url(#tl-win)">
    <rect x="20" y="55" width="360" height="155" fill="url(#tl-sky)"/>
    <g fill="#a8c2d8" opacity="0.6">
      <rect x="40" y="148" width="50" height="62"/>
      <rect x="112" y="118" width="40" height="92"/>
      <rect x="178" y="150" width="62" height="60"/>
      <rect x="282" y="126" width="54" height="84"/>
      <rect x="355" y="140" width="40" height="70"/>
    </g>
    <rect x="20" y="55" width="360" height="155" fill="url(#tl-glass)"/>
  </g>
  <rect x="20" y="55" width="360" height="155" rx="3" fill="none" stroke="#b0bccc" stroke-width="6"/>
  <g stroke="#bdc8d5" stroke-width="4">
    <line x1="20" y1="132" x2="380" y2="132"/>
    <line x1="110" y1="55" x2="110" y2="210"/>
    <line x1="200" y1="55" x2="200" y2="210"/>
    <line x1="290" y1="55" x2="290" y2="210"/>
  </g>

  <!-- Écran allumé gauche -->
  <g>
    <ellipse cx="120" cy="288" rx="90" ry="12" fill="#1b2233" opacity="0.16" filter="url(#tl-soft)"/>
    <rect x="38" y="248" width="164" height="126" rx="9" fill="#161b25"/>
    <rect x="48" y="258" width="144" height="106" rx="5" fill="url(#tl-screen)"/>
    <rect x="48" y="258" width="144" height="106" rx="5" fill="#7fb0ff" opacity="0.07"/>
    <g fill="#9cc7ff">
      <rect x="64" y="316" width="18" height="38" rx="2"/>
      <rect x="92" y="298" width="18" height="56" rx="2"/>
      <rect x="120" y="282" width="18" height="72" rx="2"/>
      <rect x="148" y="306" width="18" height="48" rx="2"/>
    </g>
    <line x1="58" y1="366" x2="184" y2="366" stroke="#4a74a8" stroke-width="2" opacity="0.7"/>
    <rect x="112" y="374" width="16" height="26" fill="#161b25"/>
    <rect x="100" y="398" width="40" height="6" rx="3" fill="#101318"/>
  </g>

  <!-- Tableau blanc mural droite -->
  <rect x="230" y="236" width="148" height="106" rx="6" fill="#f0f4fa"/>
  <rect x="230" y="236" width="148" height="106" rx="6" fill="none" stroke="#c8d2de" stroke-width="4"/>
  <g stroke="#7ba8d4" stroke-width="2" opacity="0.6">
    <line x1="250" y1="270" x2="360" y2="270"/>
    <line x1="250" y1="286" x2="340" y2="286"/>
    <line x1="250" y1="302" width="80"/>
    <line x1="250" y1="302" x2="320" y2="302"/>
  </g>
  <circle cx="258" cy="256" r="5" fill="#3b82f6" opacity="0.5"/>
  <rect x="230" y="340" width="148" height="6" rx="3" fill="#c8d2de"/>

  <!-- Formateur debout (centre) -->
  <g>
    <ellipse cx="200" cy="510" rx="32" ry="8" fill="#1b2233" opacity="0.18" filter="url(#tl-soft)"/>
    <rect x="184" y="432" width="18" height="74" rx="8" fill="#222e3f"/>
    <rect x="206" y="432" width="18" height="74" rx="8" fill="#222e3f"/>
    <rect x="176" y="344" width="56" height="98" rx="22" fill="#2e4068"/>
    <circle cx="204" cy="320" r="26" fill="#d9b692"/>
    <path d="M180 316 a24 24 0 0 1 48 0 q-24 -16 -48 0 z" fill="#4a3a2c"/>
    <!-- bras vers tableau -->
    <rect x="224" y="358" width="80" height="18" rx="9" fill="#2e4068" transform="rotate(-18 224 367)"/>
    <circle cx="298" cy="336" r="11" fill="#d9b692" transform="rotate(-18 224 367)"/>
  </g>

  <!-- Table -->
  <ellipse cx="200" cy="624" rx="286" ry="32" fill="#1b2233" opacity="0.18" filter="url(#tl-softer)"/>
  <polygon points="40,614 360,614 340,524 60,524" fill="url(#tl-edge)"/>
  <polygon points="60,524 340,524 326,508 74,508" fill="url(#tl-table)"/>
  <polygon points="80,516 320,516 312,510 88,510" fill="#ffffff" opacity="0.30"/>

  <!-- Chaises lointaines -->
  <g fill="#7a8696">
    <rect x="64" y="456" width="58" height="58" rx="13"/>
    <rect x="162" y="456" width="58" height="58" rx="13"/>
    <rect x="260" y="456" width="58" height="58" rx="13"/>
  </g>
  <g fill="#ffffff" opacity="0.10">
    <rect x="64" y="456" width="58" height="14" rx="7"/>
    <rect x="162" y="456" width="58" height="14" rx="7"/>
    <rect x="260" y="456" width="58" height="14" rx="7"/>
  </g>

  <!-- Participants -->
  <g>
    <rect x="60" y="458" width="68" height="64" rx="22" fill="#3c4e66"/>
    <circle cx="94" cy="442" r="26" fill="#eccbab"/>
    <path d="M70 438 a24 24 0 0 1 48 0 q-24 -16 -48 0 z" fill="#2f2620"/>
  </g>
  <g>
    <rect x="158" y="458" width="68" height="64" rx="22" fill="#2c3a4e"/>
    <circle cx="192" cy="442" r="26" fill="#c8a882"/>
    <path d="M168 438 a24 24 0 0 1 48 0 q-24 -16 -48 0 z" fill="#6b5640"/>
  </g>
  <g>
    <rect x="256" y="458" width="68" height="64" rx="22" fill="#45536a"/>
    <circle cx="290" cy="442" r="26" fill="#e4c6a6"/>
    <path d="M266 438 a24 24 0 0 1 48 0 q-24 -16 -48 0 z" fill="#3a2c1e"/>
  </g>

  <!-- Chaises proches -->
  <g fill="#4e5a68">
    <rect x="50" y="607" width="88" height="90" rx="17"/>
    <rect x="246" y="607" width="88" height="90" rx="17"/>
  </g>
  <g fill="#ffffff" opacity="0.09">
    <rect x="50" y="607" width="88" height="20" rx="10"/>
    <rect x="246" y="607" width="88" height="20" rx="10"/>
  </g>

  <rect x="0" y="0" width="400" height="700" fill="url(#tl-overlay)"/>
  <rect x="0" y="0" width="400" height="700" fill="url(#tl-vignette)"/>
</svg>
