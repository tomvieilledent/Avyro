<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription — Avyro</title>
    <link rel="icon" href="assets/mark-training.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="dist/styles.css" />
  </head>
  <body class="bg-gray-900">
    <div class="relative min-h-screen overflow-hidden">
      <img
        src="assets/hero-split.svg"
        alt=""
        class="absolute inset-0 h-full w-full object-cover"
      />
      <div class="absolute inset-0 bg-black/40"></div>

      <main class="relative z-10 flex min-h-screen items-center justify-center p-4 py-10">
        <div class="w-full max-w-md rounded-2xl bg-white/95 p-8 shadow-2xl backdrop-blur">
          <a href="index.html" class="mb-6 flex flex-col items-center gap-2">
            <img src="assets/mark-training.svg" alt="Avyro" class="h-14 w-14" />
            <span class="text-lg font-bold text-gray-900">Avyro</span>
          </a>
          <h1 class="text-center text-xl font-semibold">Créer un compte</h1>
          <form id="form" class="mt-5 space-y-4">
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <input class="input" name="first_name" placeholder="Prénom" required />
              <input class="input" name="last_name" placeholder="Nom" required />
            </div>
            <input class="input" name="email" type="email" placeholder="Email" required />
            <input class="input" name="phone" type="tel" placeholder="Numéro de téléphone" required />
            <input class="input" name="company_name" placeholder="Entreprise (optionnel)" />
            <input class="input" name="password" type="password" placeholder="Mot de passe (8 car. min)" required />
            <p id="error" class="hidden text-sm text-red-600"></p>
            <button class="btn-primary w-full" type="submit">Créer mon compte</button>
          </form>
          <p class="mt-4 text-center text-sm text-gray-600">
            Déjà inscrit ?
            <a href="login.html" class="font-medium text-avyro-600">Se connecter</a>
          </p>
        </div>
      </main>
    </div>

    <script src="src/api.js"></script>
    <script>
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const err = document.getElementById("error");
        err.classList.add("hidden");
        try {
          const data = await Avyro.api("/auth/register", {
            method: "POST",
            body: Object.fromEntries(f.entries()),
          });
          Avyro.setSession(data);
          location.href = "dashboard.html";
        } catch (ex) {
          err.textContent =
            ex.data?.message ||
            JSON.stringify(ex.data?.messages || {}) ||
            "Erreur";
          err.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
