<!doctype html>
<html lang="fr" class="h-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription — Avyro</title>
    <link rel="icon" href="assets/mark-training.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dist/styles.css" />
  </head>
  <body class="h-full overflow-hidden">
    <div class="relative h-screen overflow-hidden flex">
      <!-- Fond diagonal -->
      <svg id="hero-svg" class="fixed inset-0 w-screen h-screen z-0">
        <defs>
          <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1D4ED8" />
            <stop offset="100%" stop-color="#3B82F6" />
          </linearGradient>
        </defs>
        <polygon id="diag-left" fill="url(#blueGrad)" />
        <polygon id="diag-right" fill="#f8fafc" />
        <line
          id="diag-line"
          stroke="white"
          stroke-width="3"
          stroke-opacity="0.45"
          vector-effect="non-scaling-stroke"
        />
      </svg>
      <!-- Script de diagonale SVG (même logique que index.html, angle 63°) -->
      <script>
        (function () {
          const ANGLE_DEG = 63;
          const svg = document.getElementById("hero-svg");
          function update() {
            const W = window.innerWidth;
            const H = window.innerHeight;
            svg.setAttribute("viewBox", "0 0 " + W + " " + H);
            const run = H / Math.tan((ANGLE_DEG * Math.PI) / 180);
            const xTop = W / 2 + run / 2;
            const xBot = W / 2 - run / 2;
            document
              .getElementById("diag-left")
              .setAttribute("points", "0,0 " + xTop + ",0 " + xBot + "," + H + " 0," + H);
            document
              .getElementById("diag-right")
              .setAttribute(
                "points",
                xTop + ",0 " + W + ",0 " + W + "," + H + " " + xBot + "," + H,
              );
            const line = document.getElementById("diag-line");
            line.setAttribute("x1", xTop);
            line.setAttribute("y1", 0);
            line.setAttribute("x2", xBot);
            line.setAttribute("y2", H);
          }
          window.addEventListener("resize", update);
          update();
        })();
      </script>

      <!-- Gauche : branding -->
      <div
        class="relative z-10 flex flex-1 flex-col items-center justify-center py-12 pl-[8vw] pr-[4vw]"
      >
        <a href="index.html">
          <div class="bg-white rounded-2xl shadow-xl p-4 w-[220px]">
            <img src="assets/logo-avyro.svg" alt="Avyro" class="w-full" />
          </div>
        </a>
        <p class="mt-6 max-w-xs text-sm text-center text-white/75">
          La plateforme de mutualisation<br />entre entreprises
        </p>
      </div>

      <!-- Droite : formulaire -->
      <div class="relative z-10 flex flex-1 items-center justify-end h-screen pr-[5vw]">
        <div class="w-full max-w-sm">
          <h1 class="text-2xl font-bold text-gray-900 text-right">Créer un compte</h1>
          <p class="mt-1 text-sm text-gray-500 text-right">Rejoignez Avyro</p>
          <form id="form" class="mt-6 space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <label class="flex flex-col gap-1 text-xs text-gray-500"
                ><span>Prénom <span class="text-red-500">*</span></span
                ><input class="input" name="first_name" placeholder="Prénom" required
              /></label>
              <label class="flex flex-col gap-1 text-xs text-gray-500"
                ><span>Nom <span class="text-red-500">*</span></span
                ><input class="input" name="last_name" placeholder="Nom" required
              /></label>
            </div>
            <label class="flex flex-col gap-1 text-xs text-gray-500"
              ><span>Email <span class="text-red-500">*</span></span
              ><input class="input" name="email" type="email" placeholder="Email" required
            /></label>
            <label class="flex flex-col gap-1 text-xs text-gray-500"
              ><span>Téléphone <span class="text-red-500">*</span></span
              ><input
                class="input"
                name="phone"
                type="tel"
                placeholder="Numéro de téléphone"
                required
            /></label>
            <input class="input" name="company_name" placeholder="Entreprise (optionnel)" />
            <input
              class="input"
              name="tags"
              placeholder="Tags de votre entreprise, séparés par des virgules (ex: IT, RH, sécurité)"
            />
            <label class="flex flex-col gap-1 text-xs text-gray-500"
              ><span>Mot de passe <span class="text-red-500">*</span></span
              ><input
                class="input"
                name="password"
                type="password"
                placeholder="8 caractères minimum"
                required
            /></label>
            <label class="flex items-start gap-2 text-xs text-gray-600">
              <input
                type="checkbox"
                name="consent"
                required
                class="mt-0.5 shrink-0"
              />
              <span
                >J'accepte la
                <a
                  href="privacy.html"
                  target="_blank"
                  class="text-avyro-600 underline"
                  >politique de confidentialité</a
                >
                et le traitement de mes données personnelles conformément au RGPD.
                <span class="text-red-500">*</span></span
              >
            </label>
            <p id="error" class="hidden text-sm text-red-600"></p>
            <button class="btn-primary w-full" type="submit">Créer mon compte</button>
          </form>
          <p class="mt-4 text-center text-sm text-gray-600">
            Déjà inscrit ?
            <a href="login.html" class="font-medium text-avyro-600">Se connecter</a>
          </p>
        </div>
      </div>
    </div>

    <span class="fixed bottom-4 right-8 text-[0.7rem] text-[rgba(30,58,138,0.4)] tracking-[0.01em] z-10"
      >© 2026 AVYRO. Tous droits réservés.</span
    >
    <script src="src/api.js"></script>
    <!--
      Soumission du formulaire d'inscription :
      POST /api/auth/register → crée la Company + le premier User (admin).
      Si company_name est vide, l'API nommera la Company "Prénom Nom".
      Sur succès, stocke les tokens et redirige vers le dashboard.
      Sur erreur de validation, affiche le message ou les messages champs par champs.
    -->
    <script>
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const err = document.getElementById("error");
        err.classList.add("hidden");
        try {
          const data = await Avyro.api("/auth/register", {
            method: "POST",
            body: Object.fromEntries(f.entries()),
          });
          Avyro.setSession(data);
          location.href = "dashboard.html";
        } catch (ex) {
          const msgs = ex.data?.messages;
          err.textContent = msgs
            ? Object.entries(msgs)
                .map(([k, v]) => `${k} : ${v}`)
                .join(" | ")
            : ex.data?.message || "Erreur lors de l'inscription";
          err.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
