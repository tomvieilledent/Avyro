<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Salle de réunion : formation à gauche, salle libre à droite">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef4"/>
      <stop offset="1" stop-color="#d4dbe4"/>
    </linearGradient>
    <linearGradient id="ovBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="ovGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14532d" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#16a34a" stop-opacity="0.62"/>
    </linearGradient>
    <clipPath id="leftClip"><polygon points="0,0 960,0 640,900 0,900"/></clipPath>
    <clipPath id="rightClip"><polygon points="960,0 1600,0 1600,900 640,900"/></clipPath>
  </defs>

  <!-- ===== Scène commune : la même salle de réunion ===== -->
  <g>
    <!-- murs / sol -->
    <rect x="0" y="0" width="1600" height="620" fill="#eef2f7"/>
    <rect x="0" y="620" width="1600" height="280" fill="url(#floor)"/>

    <!-- baie vitrée du fond -->
    <rect x="80" y="90" width="1440" height="250" fill="#e2e9f2"/>
    <g stroke="#cbd5e1" stroke-width="5">
      <line x1="80" y1="90" x2="1520" y2="90"/>
      <line x1="80" y1="340" x2="1520" y2="340"/>
      <line x1="320" y1="90" x2="320" y2="340"/>
      <line x1="560" y1="90" x2="560" y2="340"/>
      <line x1="800" y1="90" x2="800" y2="340"/>
      <line x1="1040" y1="90" x2="1040" y2="340"/>
      <line x1="1280" y1="90" x2="1280" y2="340"/>
    </g>

    <!-- écran de présentation (gauche) -->
    <rect x="110" y="150" width="300" height="195" rx="10" fill="#1f2937"/>
    <rect x="124" y="164" width="272" height="167" rx="6" fill="#33415a"/>
    <g fill="#93c5fd">
      <rect x="150" y="250" width="34" height="60"/>
      <rect x="200" y="220" width="34" height="90"/>
      <rect x="250" y="195" width="34" height="115"/>
      <rect x="300" y="235" width="34" height="75"/>
    </g>
    <rect x="252" y="345" width="16" height="40" fill="#1f2937"/>

    <!-- écran (droite) - éteint -->
    <rect x="1190" y="150" width="300" height="195" rx="10" fill="#1f2937"/>
    <rect x="1204" y="164" width="272" height="167" rx="6" fill="#3b4860"/>
    <rect x="1332" y="345" width="16" height="40" fill="#1f2937"/>

    <!-- plante (droite, pour habiller la salle vide) -->
    <g>
      <path d="M1430 540 q-40 -70 -10 -130 q20 50 10 130 z" fill="#5b7c63"/>
      <path d="M1430 540 q40 -70 10 -130 q-20 50 -10 130 z" fill="#6f9476"/>
      <path d="M1430 545 q-2 -60 0 -110" stroke="#4b6b53" stroke-width="6" fill="none"/>
      <rect x="1408" y="540" width="44" height="48" rx="6" fill="#9aa6b2"/>
    </g>

    <!-- table de réunion (perspective) -->
    <polygon points="300,760 1300,760 1180,640 420,640" fill="#aeb9c7"/>
    <polygon points="420,640 1180,640 1160,620 440,620" fill="#c7d0db"/>

    <!-- chaises côté lointain (derrière la table) -->
    <g fill="#7c8896">
      <rect x="410" y="556" width="80" height="80" rx="16"/>
      <rect x="550" y="556" width="80" height="80" rx="16"/>
      <rect x="690" y="556" width="80" height="80" rx="16"/>
      <rect x="900" y="556" width="80" height="80" rx="16"/>
      <rect x="1040" y="556" width="80" height="80" rx="16"/>
    </g>

    <!-- chaises côté proche (devant la table) -->
    <g fill="#69727f">
      <rect x="430" y="752" width="120" height="120" rx="22"/>
      <rect x="620" y="752" width="120" height="120" rx="22"/>
      <rect x="900" y="752" width="120" height="120" rx="22"/>
      <rect x="1090" y="752" width="120" height="120" rx="22"/>
    </g>
  </g>

  <!-- ===== Personnes : uniquement à GAUCHE (formation en cours) ===== -->
  <g>
    <!-- formateur debout, près de l'écran -->
    <g>
      <rect x="214" y="470" width="34" height="150" rx="10" fill="#283548"/>
      <rect x="248" y="470" width="34" height="150" rx="10" fill="#283548"/>
      <rect x="206" y="392" width="84" height="160" rx="34" fill="#34465f"/>
      <circle cx="248" cy="360" r="36" fill="#e3c4a4"/>
      <!-- bras pointant l'écran -->
      <rect x="250" y="404" width="120" height="26" rx="13" fill="#34465f" transform="rotate(-28 250 417)"/>
    </g>

    <!-- formés assis (têtes + épaules au-dessus de la table) -->
    <g>
      <!-- 1 -->
      <rect x="408" y="556" width="84" height="80" rx="30" fill="#3f5168"/>
      <circle cx="450" cy="540" r="33" fill="#e3c4a4"/>
      <!-- 2 -->
      <rect x="548" y="556" width="84" height="80" rx="30" fill="#2f3e52"/>
      <circle cx="590" cy="540" r="33" fill="#d9b591"/>
      <!-- 3 -->
      <rect x="688" y="556" width="84" height="80" rx="30" fill="#48566b"/>
      <circle cx="730" cy="540" r="33" fill="#eccaa9"/>
    </g>
  </g>

  <!-- ===== Teintes diagonales bleu (gauche) / vert (droite) ===== -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#ovBlue)" clip-path="url(#leftClip)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#ovGreen)" clip-path="url(#rightClip)"/>
  <!-- liseré diagonal -->
  <line x1="960" y1="0" x2="640" y2="900" stroke="#ffffff" stroke-width="6" stroke-opacity="0.65"/>
</svg>
