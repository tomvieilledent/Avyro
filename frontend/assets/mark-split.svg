<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Avyro">
  <defs>
    <clipPath id="badge"><rect x="2" y="2" width="92" height="92" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <!-- bleu (triangle haut-gauche) -->
    <rect x="0" y="0" width="96" height="96" fill="#1e40af"/>
    <!-- vert (triangle bas-droite) -->
    <polygon points="96,0 96,96 0,96" fill="#16a34a"/>
    <!-- liseré diagonal -->
    <line x1="96" y1="0" x2="0" y2="96" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7"/>
  </g>
  <!-- monogramme A -->
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 70 L48 28 L66 70"/>
    <path d="M38 55 L58 55"/>
  </g>
  <circle cx="48" cy="28" r="6" fill="#ffffff"/>
</svg>
