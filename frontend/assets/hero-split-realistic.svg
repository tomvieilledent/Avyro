<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Salle de réunion : formation à gauche, salle libre à droite">
  <defs>
    <!-- ambiances lumière -->
    <radialGradient id="roomLight" cx="0.5" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.55" stop-color="#eef3f9"/>
      <stop offset="1" stop-color="#d4dce7"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8e0ea"/>
      <stop offset="0.5" stop-color="#c3cdda"/>
      <stop offset="1" stop-color="#aab6c6"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd9f5"/>
      <stop offset="0.7" stop-color="#e4f0fb"/>
      <stop offset="1" stop-color="#f4f9fe"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="tableTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#cdd6e1"/>
    </linearGradient>
    <linearGradient id="tableEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa6b6"/>
      <stop offset="1" stop-color="#7c8898"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a44"/>
      <stop offset="1" stop-color="#2d4a78"/>
    </linearGradient>
    <radialGradient id="screenVign" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#3b5a8c"/>
      <stop offset="1" stop-color="#1c2c46"/>
    </radialGradient>
    <linearGradient id="ovBlue" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="ovGreen" x1="0.6" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14532d" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#16a34a" stop-opacity="0.50"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0.35"/>
    </radialGradient>

    <clipPath id="leftClip"><polygon points="0,0 960,0 640,900 0,900"/></clipPath>
    <clipPath id="rightClip"><polygon points="960,0 1600,0 1600,900 640,900"/></clipPath>
    <clipPath id="winClip"><rect x="80" y="90" width="1440" height="250" rx="4"/></clipPath>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- ===== Scène commune : la même salle de réunion ===== -->
  <g>
    <!-- murs -->
    <rect x="0" y="0" width="1600" height="640" fill="url(#roomLight)"/>
    <!-- plinthe -->
    <rect x="0" y="612" width="1600" height="14" fill="#c0c9d6"/>
    <!-- sol -->
    <rect x="0" y="626" width="1600" height="274" fill="url(#floor)"/>
    <!-- reflet de la baie sur le sol -->
    <rect x="120" y="626" width="1360" height="120" fill="#ffffff" opacity="0.10"/>

    <!-- baie vitrée du fond -->
    <g clip-path="url(#winClip)">
      <rect x="80" y="90" width="1440" height="250" fill="url(#sky)"/>
      <!-- silhouettes d'immeubles lointains -->
      <g fill="#aac4dd" opacity="0.7">
        <rect x="180" y="220" width="90" height="120"/>
        <rect x="300" y="180" width="70" height="160"/>
        <rect x="430" y="240" width="110" height="100"/>
        <rect x="980" y="200" width="80" height="140"/>
        <rect x="1120" y="170" width="100" height="170"/>
        <rect x="1280" y="235" width="90" height="105"/>
      </g>
      <!-- voile lumineux -->
      <rect x="80" y="90" width="1440" height="250" fill="url(#glassSheen)"/>
    </g>
    <!-- cadre + meneaux -->
    <rect x="80" y="90" width="1440" height="250" rx="4" fill="none" stroke="#b6c1d0" stroke-width="8"/>
    <g stroke="#c6d0dd" stroke-width="5">
      <line x1="80" y1="215" x2="1520" y2="215"/>
      <line x1="320" y1="90" x2="320" y2="340"/>
      <line x1="560" y1="90" x2="560" y2="340"/>
      <line x1="800" y1="90" x2="800" y2="340"/>
      <line x1="1040" y1="90" x2="1040" y2="340"/>
      <line x1="1280" y1="90" x2="1280" y2="340"/>
    </g>

    <!-- écran de présentation (gauche, allumé) -->
    <g>
      <ellipse cx="260" cy="360" rx="190" ry="22" fill="#1b2233" opacity="0.18" filter="url(#soft)"/>
      <rect x="110" y="150" width="300" height="195" rx="12" fill="#161b25"/>
      <rect x="124" y="164" width="272" height="167" rx="7" fill="url(#screenVign)"/>
      <!-- halo lumineux de l'écran -->
      <rect x="124" y="164" width="272" height="167" rx="7" fill="#7fb0ff" opacity="0.10"/>
      <g fill="#9cc7ff">
        <rect x="150" y="250" width="34" height="60" rx="3"/>
        <rect x="200" y="220" width="34" height="90" rx="3"/>
        <rect x="250" y="195" width="34" height="115" rx="3"/>
        <rect x="300" y="235" width="34" height="75" rx="3"/>
      </g>
      <line x1="150" y1="312" x2="334" y2="312" stroke="#5b86c4" stroke-width="3" opacity="0.6"/>
      <rect x="252" y="345" width="16" height="40" fill="#161b25"/>
      <rect x="232" y="383" width="56" height="8" rx="4" fill="#11151d"/>
    </g>

    <!-- écran (droite, éteint) -->
    <g>
      <ellipse cx="1340" cy="360" rx="190" ry="22" fill="#1b2233" opacity="0.18" filter="url(#soft)"/>
      <rect x="1190" y="150" width="300" height="195" rx="12" fill="#161b25"/>
      <rect x="1204" y="164" width="272" height="167" rx="7" fill="#2b3344"/>
      <rect x="1204" y="164" width="272" height="167" rx="7" fill="url(#glassSheen)" opacity="0.25"/>
      <rect x="1332" y="345" width="16" height="40" fill="#161b25"/>
      <rect x="1312" y="383" width="56" height="8" rx="4" fill="#11151d"/>
    </g>

    <!-- plante (droite, pour habiller la salle vide) -->
    <g>
      <ellipse cx="1430" cy="592" rx="60" ry="12" fill="#1b2233" opacity="0.18" filter="url(#soft)"/>
      <path d="M1430 545 q-55 -78 -16 -150 q26 60 16 150 z" fill="#557a5f"/>
      <path d="M1430 545 q55 -78 16 -150 q-26 60 -16 150 z" fill="#6f9476"/>
      <path d="M1430 545 q-30 -70 -60 -92 q34 12 60 92 z" fill="#4d7058"/>
      <path d="M1430 545 q30 -70 60 -92 q-34 12 -60 92 z" fill="#7ba081"/>
      <path d="M1430 548 q-2 -64 0 -118" stroke="#43624c" stroke-width="6" fill="none"/>
      <path d="M1402 588 h56 l-7 -50 h-42 z" fill="#aab4c0"/>
      <path d="M1402 588 h56 l-2 -14 h-52 z" fill="#8c98a6"/>
    </g>

    <!-- table de réunion (perspective) -->
    <ellipse cx="800" cy="770" rx="540" ry="60" fill="#1b2233" opacity="0.20" filter="url(#softer)"/>
    <polygon points="300,760 1300,760 1180,642 420,642" fill="url(#tableEdge)"/>
    <polygon points="420,642 1180,642 1160,620 440,620" fill="url(#tableTop)"/>
    <!-- reflet doux sur le plateau -->
    <polygon points="470,636 1130,636 1115,624 485,624" fill="#ffffff" opacity="0.35"/>

    <!-- chaises côté lointain (derrière la table) -->
    <g fill="#828e9c">
      <rect x="410" y="556" width="80" height="80" rx="18"/>
      <rect x="550" y="556" width="80" height="80" rx="18"/>
      <rect x="690" y="556" width="80" height="80" rx="18"/>
      <rect x="900" y="556" width="80" height="80" rx="18"/>
      <rect x="1040" y="556" width="80" height="80" rx="18"/>
    </g>
    <g fill="#ffffff" opacity="0.12">
      <rect x="410" y="556" width="80" height="20" rx="10"/>
      <rect x="550" y="556" width="80" height="20" rx="10"/>
      <rect x="690" y="556" width="80" height="20" rx="10"/>
      <rect x="900" y="556" width="80" height="20" rx="10"/>
      <rect x="1040" y="556" width="80" height="20" rx="10"/>
    </g>

    <!-- chaises côté proche (devant la table) -->
    <g>
      <g fill="#5e6773">
        <rect x="430" y="752" width="120" height="124" rx="24"/>
        <rect x="620" y="752" width="120" height="124" rx="24"/>
        <rect x="900" y="752" width="120" height="124" rx="24"/>
        <rect x="1090" y="752" width="120" height="124" rx="24"/>
      </g>
      <g fill="#ffffff" opacity="0.10">
        <rect x="430" y="752" width="120" height="28" rx="14"/>
        <rect x="620" y="752" width="120" height="28" rx="14"/>
        <rect x="900" y="752" width="120" height="28" rx="14"/>
        <rect x="1090" y="752" width="120" height="28" rx="14"/>
      </g>
    </g>
  </g>

  <!-- ===== Personnes : uniquement à GAUCHE (formation en cours) ===== -->
  <g>
    <!-- formateur debout, près de l'écran -->
    <g>
      <ellipse cx="248" cy="632" rx="70" ry="14" fill="#1b2233" opacity="0.22" filter="url(#soft)"/>
      <rect x="214" y="470" width="34" height="155" rx="12" fill="#222e3f"/>
      <rect x="248" y="470" width="34" height="155" rx="12" fill="#222e3f"/>
      <rect x="206" y="392" width="84" height="162" rx="36" fill="#324360"/>
      <rect x="206" y="392" width="38" height="162" rx="36" fill="#3a4d6e"/>
      <circle cx="248" cy="358" r="37" fill="#e4c6a6"/>
      <path d="M214 350 a34 34 0 0 1 68 0 q-34 -22 -68 0 z" fill="#5b4634"/>
      <!-- bras pointant l'écran -->
      <rect x="250" y="402" width="124" height="27" rx="13" fill="#324360" transform="rotate(-28 250 415)"/>
      <circle cx="368" cy="350" r="15" fill="#e4c6a6" transform="rotate(-28 250 415)"/>
    </g>

    <!-- formés assis (têtes + épaules au-dessus de la table) -->
    <g>
      <!-- 1 -->
      <rect x="406" y="556" width="88" height="84" rx="32" fill="#3c4e66"/>
      <rect x="406" y="556" width="40" height="84" rx="32" fill="#46597440"/>
      <circle cx="450" cy="538" r="34" fill="#e4c6a6"/>
      <path d="M418 532 a32 32 0 0 1 64 0 q-32 -20 -64 0 z" fill="#2f2620"/>
      <!-- 2 -->
      <rect x="546" y="556" width="88" height="84" rx="32" fill="#2c3a4e"/>
      <rect x="546" y="556" width="40" height="84" rx="32" fill="#37485e40"/>
      <circle cx="590" cy="538" r="34" fill="#d9b692"/>
      <path d="M558 534 a32 32 0 0 1 64 0 q-32 -22 -64 0 z" fill="#4a3a2c"/>
      <!-- 3 -->
      <rect x="686" y="556" width="88" height="84" rx="32" fill="#45536a"/>
      <rect x="686" y="556" width="40" height="84" rx="32" fill="#52617a40"/>
      <circle cx="730" cy="538" r="34" fill="#eccbab"/>
      <path d="M698 534 a32 32 0 0 1 64 0 q-32 -20 -64 0 z" fill="#6b5640"/>
    </g>
  </g>

  <!-- ===== Teintes diagonales bleu (gauche) / vert (droite) ===== -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#ovBlue)" clip-path="url(#leftClip)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#ovGreen)" clip-path="url(#rightClip)"/>
  <!-- vignettage cinématique -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#vignette)"/>
  <!-- liseré diagonal -->
  <line x1="960" y1="0" x2="640" y2="900" stroke="#ffffff" stroke-width="6" stroke-opacity="0.7"/>
  <line x1="960" y1="0" x2="640" y2="900" stroke="#ffffff" stroke-width="16" stroke-opacity="0.12"/>
</svg>
