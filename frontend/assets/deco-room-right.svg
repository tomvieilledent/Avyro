<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700" role="img" aria-label="Salle de réunion — vue droite">
  <defs>
    <radialGradient id="rr-light" cx="0.5" cy="0.10" r="0.94">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2f4f7"/>
      <stop offset="1" stop-color="#e0e4ea"/>
    </radialGradient>
    <linearGradient id="rr-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4d9e2"/>
      <stop offset="1" stop-color="#bbc0ca"/>
    </linearGradient>
    <linearGradient id="rr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bccede"/>
      <stop offset="0.65" stop-color="#e4eaf0"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="rr-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.52"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="rr-table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#edf0f4"/>
      <stop offset="1" stop-color="#ced4de"/>
    </linearGradient>
    <linearGradient id="rr-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4acb8"/>
      <stop offset="1" stop-color="#848e9c"/>
    </linearGradient>
    <linearGradient id="rr-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e242c"/>
      <stop offset="1" stop-color="#161a20"/>
    </linearGradient>
    <linearGradient id="rr-overlay" x1="0.6" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18202c" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#232c38" stop-opacity="0.52"/>
    </linearGradient>
    <radialGradient id="rr-vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#08090c" stop-opacity="0.50"/>
    </radialGradient>
    <filter id="rr-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="rr-softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="rr-win"><rect x="20" y="52" width="360" height="158" rx="3"/></clipPath>
  </defs>

  <!-- Mur blanc cassé avec wainscot -->
  <rect x="0" y="0" width="400" height="520" fill="url(#rr-light)"/>
  <rect x="0" y="362" width="400" height="8" fill="#d8dce4"/>
  <rect x="0" y="370" width="400" height="128" fill="#eaecf0"/>
  <rect x="0" y="498" width="400" height="12" fill="#c0c6ce"/>
  <rect x="0" y="510" width="400" height="190" fill="url(#rr-floor)"/>
  <rect x="0" y="510" width="400" height="78" fill="#ffffff" opacity="0.09"/>

  <!-- Baie vitrée -->
  <g clip-path="url(#rr-win)">
    <rect x="20" y="52" width="360" height="158" fill="url(#rr-sky)"/>
    <g fill="#aabccc" opacity="0.55">
      <rect x="44" y="144" width="46" height="66"/>
      <rect x="112" y="116" width="40" height="94"/>
      <rect x="176" y="148" width="62" height="62"/>
      <rect x="276" y="122" width="52" height="88"/>
      <rect x="352" y="138" width="38" height="72"/>
    </g>
    <rect x="20" y="52" width="360" height="158" fill="url(#rr-glass)"/>
  </g>
  <rect x="20" y="52" width="360" height="158" rx="3" fill="none" stroke="#bcc8d4" stroke-width="6"/>
  <g stroke="#c6d0da" stroke-width="4">
    <line x1="20" y1="130" x2="380" y2="130"/>
    <line x1="110" y1="52" x2="110" y2="210"/>
    <line x1="200" y1="52" x2="200" y2="210"/>
    <line x1="290" y1="52" x2="290" y2="210"/>
  </g>

  <!-- Écran grande taille, éteint, reflet -->
  <g>
    <ellipse cx="200" cy="294" rx="150" ry="14" fill="#181c22" opacity="0.14" filter="url(#rr-soft)"/>
    <rect x="46" y="242" width="308" height="172" rx="12" fill="#13171d"/>
    <rect x="58" y="254" width="284" height="148" rx="7" fill="url(#rr-screen)"/>
    <!-- Reflet fenêtre sur écran éteint -->
    <rect x="58" y="254" width="80" height="148" rx="4" fill="#ffffff" opacity="0.03"/>
    <rect x="130" y="254" width="2" height="148" fill="#ffffff" opacity="0.05"/>
    <!-- Heure / veille centrée -->
    <rect x="168" y="306" width="64" height="22" rx="6" fill="#2e3440" opacity="0.8"/>
    <rect x="178" y="312" width="44" height="10" rx="4" fill="#94a3b8" opacity="0.45"/>
    <!-- Voyant veille -->
    <circle cx="194" cy="336" r="5" fill="#94a3b8" opacity="0.65"/>
    <rect x="190" y="414" width="20" height="26" fill="#13171d"/>
    <rect x="174" y="438" width="52" height="6" rx="3" fill="#0e1014"/>
  </g>

  <!-- Étagère murale avec accessoires (gauche) -->
  <rect x="14" y="236" width="22" height="96" rx="4" fill="#c8cdd6"/>
  <rect x="14" y="330" width="90" height="6" rx="3" fill="#d0d4dc"/>
  <!-- Livres sur étagère -->
  <rect x="20" y="284" width="16" height="46" rx="2" fill="#8ea8c4"/>
  <rect x="38" y="290" width="12" height="40" rx="2" fill="#b4c8da"/>
  <rect x="52" y="280" width="14" height="50" rx="2" fill="#d4e0ea"/>
  <rect x="68" y="292" width="10" height="38" rx="2" fill="#a0b4c8"/>
  <rect x="80" y="286" width="12" height="44" rx="2" fill="#c0d0de"/>

  <!-- Plante élégante (droite) -->
  <g>
    <ellipse cx="362" cy="510" rx="32" ry="8" fill="#181c22" opacity="0.14" filter="url(#rr-soft)"/>
    <path d="M362 464 q-36 -54 -10 -108 q18 42 10 108 z" fill="#6e8874"/>
    <path d="M362 464 q36 -54 10 -108 q-18 42 -10 108 z" fill="#82a08a"/>
    <path d="M362 464 q-20 -48 -44 -62 q24 8 44 62 z" fill="#5c7862"/>
    <path d="M362 464 q20 -48 44 -62 q-24 8 -44 62 z" fill="#8cb898"/>
    <path d="M362 466 q-2 -46 0 -86" stroke="#547060" stroke-width="5" fill="none"/>
    <!-- Pot -->
    <path d="M342 500 h40 l-5 -34 h-30 z" fill="#b4bec8"/>
    <path d="M342 500 h40 l-2 -11 h-38 z" fill="#9ea8b2"/>
  </g>

  <!-- Table rectangulaire moderne (bords droits) -->
  <ellipse cx="200" cy="630" rx="284" ry="32" fill="#181c22" opacity="0.17" filter="url(#rr-softer)"/>
  <rect x="44" y="526" width="312" height="94" fill="url(#rr-edge)"/>
  <rect x="44" y="516" width="312" height="16" fill="url(#rr-table)"/>
  <rect x="52" y="516" width="296" height="6" fill="#ffffff" opacity="0.28"/>
  <!-- Pied de table -->
  <rect x="88" y="620" width="20" height="52" rx="6" fill="#8892a0"/>
  <rect x="292" y="620" width="20" height="52" rx="6" fill="#8892a0"/>

  <!-- Chaises lointaines design (hauts dossiers) -->
  <g fill="#848e9c">
    <rect x="66" y="420" width="56" height="94" rx="12"/>
    <rect x="168" y="420" width="56" height="94" rx="12"/>
    <rect x="270" y="420" width="56" height="94" rx="12"/>
  </g>
  <g fill="#ffffff" opacity="0.10">
    <rect x="66" y="420" width="56" height="16" rx="8"/>
    <rect x="168" y="420" width="56" height="16" rx="8"/>
    <rect x="270" y="420" width="56" height="16" rx="8"/>
  </g>

  <!-- Ordinateurs portables fermés sur table -->
  <g fill="#d0d6e0" opacity="0.6">
    <rect x="112" y="516" width="50" height="28" rx="5"/>
    <rect x="230" y="516" width="50" height="28" rx="5"/>
  </g>
  <g fill="#b8c0cc" opacity="0.5">
    <rect x="114" y="517" width="46" height="5" rx="2"/>
    <rect x="232" y="517" width="46" height="5" rx="2"/>
  </g>
  <!-- Bloc-notes -->
  <rect x="178" y="516" width="36" height="28" rx="4" fill="#e8ecf0" opacity="0.6"/>
  <g fill="#94a0b0" opacity="0.5">
    <line x1="182" y1="522" x2="210" y2="522" stroke="#94a0b0" stroke-width="2"/>
    <line x1="182" y1="529" x2="206" y2="529" stroke="#94a0b0" stroke-width="2"/>
    <line x1="182" y1="536" x2="200" y2="536" stroke="#94a0b0" stroke-width="2"/>
  </g>

  <!-- Chaises proches design -->
  <g fill="#585e6c">
    <rect x="50" y="614" width="90" height="86" rx="16"/>
    <rect x="252" y="614" width="90" height="86" rx="16"/>
  </g>
  <g fill="#ffffff" opacity="0.10">
    <rect x="50" y="614" width="90" height="20" rx="10"/>
    <rect x="252" y="614" width="90" height="20" rx="10"/>
  </g>

  <rect x="0" y="0" width="400" height="700" fill="url(#rr-overlay)"/>
  <rect x="0" y="0" width="400" height="700" fill="url(#rr-vignette)"/>
</svg>
