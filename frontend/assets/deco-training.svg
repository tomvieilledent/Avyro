<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" width="400" height="700" role="img" aria-label="Formation en salle">
  <defs>
    <radialGradient id="t-light" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#f0f6ff"/>
      <stop offset="0.6" stop-color="#dde8f5"/>
      <stop offset="1" stop-color="#c4d0e0"/>
    </radialGradient>
    <linearGradient id="t-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdd6e2"/>
      <stop offset="1" stop-color="#b0bccb"/>
    </linearGradient>
    <linearGradient id="t-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ec5f0"/>
      <stop offset="0.8" stop-color="#d8ecfb"/>
      <stop offset="1" stop-color="#eef5fd"/>
    </linearGradient>
    <linearGradient id="t-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="t-screen" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#3b5a8c"/>
      <stop offset="1" stop-color="#1c2c46"/>
    </radialGradient>
    <linearGradient id="t-table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#cdd6e1"/>
    </linearGradient>
    <linearGradient id="t-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa6b6"/>
      <stop offset="1" stop-color="#7c8898"/>
    </linearGradient>
    <linearGradient id="t-overlay" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="t-vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="t-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="t-softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="t-win"><rect x="20" y="55" width="360" height="160" rx="3"/></clipPath>
  </defs>

  <!-- Mur -->
  <rect x="0" y="0" width="400" height="520" fill="url(#t-light)"/>
  <!-- Plinthe -->
  <rect x="0" y="498" width="400" height="12" fill="#b8c2cf"/>
  <!-- Sol -->
  <rect x="0" y="510" width="400" height="190" fill="url(#t-floor)"/>
  <rect x="0" y="510" width="400" height="80" fill="#ffffff" opacity="0.08"/>

  <!-- Baie vitrée -->
  <g clip-path="url(#t-win)">
    <rect x="20" y="55" width="360" height="160" fill="url(#t-sky)"/>
    <g fill="#a8c2d8" opacity="0.6">
      <rect x="40" y="150" width="50" height="65"/>
      <rect x="110" y="120" width="40" height="95"/>
      <rect x="175" y="152" width="62" height="63"/>
      <rect x="280" y="128" width="54" height="87"/>
      <rect x="355" y="142" width="40" height="73"/>
    </g>
    <rect x="20" y="55" width="360" height="160" fill="url(#t-glass)"/>
  </g>
  <rect x="20" y="55" width="360" height="160" rx="3" fill="none" stroke="#b0bccc" stroke-width="6"/>
  <g stroke="#bdc8d5" stroke-width="4">
    <line x1="20" y1="135" x2="380" y2="135"/>
    <line x1="110" y1="55" x2="110" y2="215"/>
    <line x1="200" y1="55" x2="200" y2="215"/>
    <line x1="290" y1="55" x2="290" y2="215"/>
  </g>

  <!-- Écran de présentation allumé -->
  <g>
    <ellipse cx="200" cy="292" rx="118" ry="14" fill="#1b2233" opacity="0.16" filter="url(#t-soft)"/>
    <rect x="78" y="248" width="244" height="158" rx="10" fill="#161b25"/>
    <rect x="90" y="260" width="220" height="134" rx="6" fill="url(#t-screen)"/>
    <rect x="90" y="260" width="220" height="134" rx="6" fill="#7fb0ff" opacity="0.07"/>
    <!-- Graphique -->
    <g fill="#9cc7ff">
      <rect x="116" y="332" width="26" height="52" rx="2"/>
      <rect x="156" y="308" width="26" height="76" rx="2"/>
      <rect x="196" y="288" width="26" height="96" rx="2"/>
      <rect x="236" y="318" width="26" height="66" rx="2"/>
      <rect x="276" y="300" width="26" height="84" rx="2"/>
    </g>
    <line x1="108" y1="386" x2="308" y2="386" stroke="#4a74a8" stroke-width="2" opacity="0.7"/>
    <rect x="190" y="406" width="20" height="30" fill="#161b25"/>
    <rect x="174" y="434" width="52" height="7" rx="3" fill="#101318"/>
  </g>

  <!-- Formateur debout -->
  <g>
    <ellipse cx="66" cy="510" rx="36" ry="9" fill="#1b2233" opacity="0.18" filter="url(#t-soft)"/>
    <rect x="48" y="432" width="20" height="74" rx="8" fill="#222e3f"/>
    <rect x="72" y="432" width="20" height="74" rx="8" fill="#222e3f"/>
    <rect x="40" y="342" width="60" height="102" rx="22" fill="#324360"/>
    <rect x="40" y="342" width="28" height="102" rx="22" fill="#3a4d6e"/>
    <circle cx="70" cy="318" r="28" fill="#e4c6a6"/>
    <path d="M44 313 a26 26 0 0 1 52 0 q-26 -18 -52 0 z" fill="#5b4634"/>
    <!-- Bras pointant l'écran -->
    <rect x="88" y="360" width="92" height="20" rx="10" fill="#324360" transform="rotate(-24 88 370)"/>
    <circle cx="174" cy="334" r="12" fill="#e4c6a6" transform="rotate(-24 88 370)"/>
  </g>

  <!-- Table de conférence -->
  <ellipse cx="200" cy="624" rx="290" ry="34" fill="#1b2233" opacity="0.18" filter="url(#t-softer)"/>
  <polygon points="38,614 362,614 342,522 58,522" fill="url(#t-edge)"/>
  <polygon points="58,522 342,522 328,506 72,506" fill="url(#t-table)"/>
  <polygon points="78,514 322,514 314,508 86,508" fill="#ffffff" opacity="0.30"/>

  <!-- Chaises côté lointain -->
  <g fill="#7a8696">
    <rect x="62" y="454" width="60" height="60" rx="14"/>
    <rect x="162" y="454" width="60" height="60" rx="14"/>
    <rect x="262" y="454" width="60" height="60" rx="14"/>
  </g>
  <g fill="#ffffff" opacity="0.10">
    <rect x="62" y="454" width="60" height="15" rx="7"/>
    <rect x="162" y="454" width="60" height="15" rx="7"/>
    <rect x="262" y="454" width="60" height="15" rx="7"/>
  </g>

  <!-- Participant 1 -->
  <g>
    <rect x="58" y="456" width="72" height="68" rx="24" fill="#3c4e66"/>
    <circle cx="94" cy="440" r="28" fill="#eccbab"/>
    <path d="M67 436 a27 27 0 0 1 54 0 q-27 -17 -54 0 z" fill="#2f2620"/>
  </g>
  <!-- Participant 2 -->
  <g>
    <rect x="158" y="456" width="72" height="68" rx="24" fill="#2c3a4e"/>
    <circle cx="194" cy="440" r="28" fill="#d9b692"/>
    <path d="M167 436 a27 27 0 0 1 54 0 q-27 -18 -54 0 z" fill="#4a3a2c"/>
  </g>
  <!-- Participant 3 -->
  <g>
    <rect x="258" y="456" width="72" height="68" rx="24" fill="#45536a"/>
    <circle cx="294" cy="440" r="28" fill="#e4c6a6"/>
    <path d="M267 436 a27 27 0 0 1 54 0 q-27 -17 -54 0 z" fill="#6b5640"/>
  </g>

  <!-- Chaises côté proche -->
  <g fill="#4e5a68">
    <rect x="48" y="607" width="90" height="92" rx="18"/>
    <rect x="248" y="607" width="90" height="92" rx="18"/>
  </g>
  <g fill="#ffffff" opacity="0.09">
    <rect x="48" y="607" width="90" height="22" rx="11"/>
    <rect x="248" y="607" width="90" height="22" rx="11"/>
  </g>

  <!-- Overlay bleu -->
  <rect x="0" y="0" width="400" height="700" fill="url(#t-overlay)"/>
  <!-- Vignette -->
  <rect x="0" y="0" width="400" height="700" fill="url(#t-vignette)"/>
</svg>
