<!doctype html>
<html lang="fr" class="h-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rejoindre l'équipe — Avyro</title>
    <link rel="icon" href="assets/mark-training.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dist/styles.css" />
  </head>
  <body class="h-full overflow-hidden">
    <div class="relative h-screen overflow-hidden flex">
      <!-- Fond diagonal -->
      <svg id="hero-svg" class="fixed inset-0 w-screen h-screen z-0">
        <defs>
          <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1D4ED8" />
            <stop offset="100%" stop-color="#3B82F6" />
          </linearGradient>
        </defs>
        <polygon id="diag-left" fill="url(#blueGrad)" />
        <polygon id="diag-right" fill="#f8fafc" />
        <line
          id="diag-line"
          stroke="white"
          stroke-width="3"
          stroke-opacity="0.45"
          vector-effect="non-scaling-stroke"
        />
      </svg>
      <script>
        (function () {
          const ANGLE_DEG = 63;
          const svg = document.getElementById("hero-svg");
          function update() {
            const W = window.innerWidth,
              H = window.innerHeight;
            svg.setAttribute("viewBox", "0 0 " + W + " " + H);
            const run = H / Math.tan((ANGLE_DEG * Math.PI) / 180);
            const xTop = W / 2 + run / 2,
              xBot = W / 2 - run / 2;
            document
              .getElementById("diag-left")
              .setAttribute("points", "0,0 " + xTop + ",0 " + xBot + "," + H + " 0," + H);
            document
              .getElementById("diag-right")
              .setAttribute(
                "points",
                xTop + ",0 " + W + ",0 " + W + "," + H + " " + xBot + "," + H,
              );
            const l = document.getElementById("diag-line");
            l.setAttribute("x1", xTop);
            l.setAttribute("y1", 0);
            l.setAttribute("x2", xBot);
            l.setAttribute("y2", H);
          }
          window.addEventListener("resize", update);
          update();
        })();
      </script>

      <!-- Gauche : branding -->
      <div
        class="relative z-10 flex flex-1 flex-col items-center justify-center py-12 pl-[8vw] pr-[4vw]"
      >
        <a href="index.html">
          <div class="bg-white rounded-2xl shadow-xl p-4 w-[220px]">
            <img src="assets/logo-avyro.svg" alt="Avyro" class="w-full" />
          </div>
        </a>
        <p
          id="company-label"
          class="mt-6 max-w-xs text-sm text-center font-semibold text-white"
        ></p>
        <p class="mt-2 max-w-xs text-sm text-center text-white/75">
          vous invite à rejoindre Avyro
        </p>
      </div>

      <!-- Droite : formulaire -->
      <div class="relative z-10 flex flex-1 items-center justify-end h-screen pr-[5vw]">
        <div class="w-full max-w-sm">
          <h1 class="text-2xl font-bold text-gray-900 text-right">Rejoindre l'équipe</h1>
          <p id="invite-email-display" class="mt-1 text-sm text-gray-500 text-right"></p>
          <div
            id="invalid-msg"
            class="hidden mt-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700"
          >
            Ce lien d'invitation est invalide ou a expiré.
          </div>
          <form id="form" class="mt-6 space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <input class="input" name="first_name" placeholder="Prénom" required />
              <input class="input" name="last_name" placeholder="Nom" required />
            </div>
            <input
              class="input"
              name="phone"
              type="tel"
              placeholder="Numéro de téléphone"
              required
            />
            <input
              class="input"
              name="password"
              type="password"
              placeholder="Mot de passe (8 car. min)"
              required
            />
            <p id="error" class="hidden text-sm text-red-600"></p>
            <button class="btn-primary w-full" type="submit">Créer mon compte</button>
          </form>
          <p class="mt-4 text-center text-sm text-gray-600">
            Déjà inscrit ?
            <a href="login.html" class="font-medium text-avyro-600">Se connecter</a>
          </p>
        </div>
      </div>
    </div>

    <span class="fixed bottom-4 right-8 text-[0.7rem] text-[rgba(30,58,138,0.4)] tracking-[0.01em] z-10"
      >© 2026 AVYRO. Tous droits réservés.</span
    >
    <script src="src/api.js"></script>
    <script>
      const token = new URLSearchParams(location.search).get("token");

      if (!token) {
        document.getElementById("invalid-msg").classList.remove("hidden");
        document.getElementById("form").style.display = "none";
      } else {
        try {
          const payload = JSON.parse(
            atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")),
          );
          if (payload.invite_email) {
            document.getElementById("invite-email-display").textContent = payload.invite_email;
          }
          if (payload.company_id) {
            Avyro.api("/companies/" + payload.company_id)
              .then((c) => {
                document.getElementById("company-label").textContent = c.name;
              })
              .catch(() => {});
          }
        } catch (_) {}
      }

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const err = document.getElementById("error");
        err.classList.add("hidden");
        try {
          const data = await Avyro.api("/auth/accept-invite", {
            method: "POST",
            body: { token, ...Object.fromEntries(f.entries()) },
          });
          Avyro.setSession(data);
          location.href = "dashboard.html";
        } catch (ex) {
          err.textContent = ex.data?.message || JSON.stringify(ex.data?.messages || {}) || "Erreur";
          err.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
