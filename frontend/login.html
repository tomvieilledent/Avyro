<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — Avyro</title>
    <link rel="icon" href="assets/mark-training.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="dist/styles.css" />
  </head>
  <body>
    <div class="relative min-h-screen overflow-hidden flex">

      <!-- Fond diagonal bleu / blanc -->
      <svg class="absolute inset-0 w-full h-full" preserveAspectRatio="none" viewBox="0 0 1600 900">
        <defs>
          <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1e3a8a"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
          </linearGradient>
        </defs>
        <polygon points="0,0 960,0 640,900 0,900" fill="url(#blueGrad)"/>
        <polygon points="960,0 1600,0 1600,900 640,900" fill="#ffffff"/>
        <line x1="960" y1="0" x2="640" y2="900" stroke="#e5e7eb" stroke-width="2"/>
      </svg>

      <!-- Gauche : branding -->
      <div class="relative z-10 flex flex-1 flex-col items-start justify-center px-16 py-12">
        <a href="index.html">
          <img src="assets/logo-training2.svg" alt="Avyro Training" class="w-52" />
        </a>
        <p class="mt-6 max-w-xs text-sm" style="color:rgba(255,255,255,0.75)">
          La plateforme de mutualisation<br>entre entreprises
        </p>
      </div>

      <!-- Droite : formulaire -->
      <div class="relative z-10 flex flex-1 items-center justify-center px-12 py-12">
        <div class="w-full max-w-sm">
          <h1 class="text-2xl font-bold text-gray-900">Connexion</h1>
          <p class="mt-1 text-sm text-gray-500">Bienvenue sur Avyro</p>
          <form id="form" class="mt-6 space-y-4">
            <input class="input" name="email" type="email" placeholder="Email" required />
            <input class="input" name="password" type="password" placeholder="Mot de passe" required />
            <p id="error" class="hidden text-sm text-red-600"></p>
            <button class="btn-primary w-full" type="submit">Se connecter</button>
          </form>
          <p class="mt-4 text-center text-sm text-gray-600">
            Pas de compte ?
            <a href="register.html" class="font-medium" style="color:#1D4ED8">Créer un compte</a>
          </p>
        </div>
      </div>

    </div>

    <script src="src/api.js"></script>
    <script>
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const err = document.getElementById("error");
        err.classList.add("hidden");
        try {
          const data = await Avyro.api("/auth/login", {
            method: "POST",
            body: { email: f.get("email"), password: f.get("password") },
          });
          Avyro.setSession(data);
          location.href = "dashboard.html";
        } catch (ex) {
          err.textContent = ex.data?.message || "Identifiants invalides";
          err.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
