<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — Avyro</title>
    <link rel="stylesheet" href="dist/styles.css" />
  </head>
  <body class="bg-avyro-50">
    <main class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-4">
      <a href="index.html" class="mb-6 text-center text-2xl font-bold text-avyro-700">Avyro</a>
      <div class="card">
        <h1 class="text-xl font-semibold">Connexion</h1>
        <form id="form" class="mt-4 space-y-4">
          <input class="input" name="email" type="email" placeholder="Email" required />
          <input class="input" name="password" type="password" placeholder="Mot de passe" required />
          <p id="error" class="hidden text-sm text-red-600"></p>
          <button class="btn-primary w-full" type="submit">Se connecter</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">
          Pas de compte ?
          <a href="register.html" class="font-medium text-avyro-600">Créer un compte</a>
        </p>
      </div>
    </main>

    <script src="src/api.js"></script>
    <script>
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = new FormData(e.target);
        const err = document.getElementById("error");
        err.classList.add("hidden");
        try {
          const data = await Avyro.api("/auth/login", {
            method: "POST",
            body: { email: f.get("email"), password: f.get("password") },
          });
          Avyro.setSession(data);
          location.href = "dashboard.html";
        } catch (ex) {
          err.textContent = ex.data?.message || "Identifiants invalides";
          err.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
