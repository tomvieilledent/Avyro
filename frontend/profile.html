<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon profil — Avyro</title>
    <link rel="icon" href="assets/mark-training.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dist/styles.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      /* ── Base ──────────────────────────────────────────── */
      body {
        background: #e8f0fe;
      }

      /* ── Header ────────────────────────────────────────── */
      .app-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        z-index: 30;
        background: #1e3a8a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 2rem;
        box-shadow: 0 2px 8px rgba(15, 23, 62, 0.25);
      }
      /* Lien logo (retour dashboard) */
      .logo-link {
        color: #fff;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 9px;
      }

      /* Boutons de header (retour, déconnexion…) */
      .hbtn {
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: #fff;
        background: transparent;
        border-radius: 6px;
        padding: 5px 13px;
        font-size: 0.8125rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
        text-decoration: none;
        line-height: 1.4;
      }
      .hbtn:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      /* ── Main scroll area ──────────────────────────────── */
      .app-main {
        position: fixed;
        top: 60px;
        left: 0;
        width: 100%;
        height: calc(100vh - 60px);
        overflow-y: auto;
      }
      /* Contenu centré, largeur max 720px */
      .app-content {
        max-width: 720px;
        margin: 0 auto;
        padding: 2rem;
      }

      /* ── Variante mode Room (thème clair) ──────────────── */
      body.mode-room {
        background: #f8fafc;
      }
      body.mode-room .app-header {
        background: #fff;
        border-bottom: 1px solid #e2e8f0;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      }
      body.mode-room .logo-link {
        color: #0f172a;
      }
      body.mode-room .hbtn {
        border-color: #e2e8f0;
        color: #374151;
      }
      body.mode-room .hbtn:hover {
        background: #f3f4f6;
      }

      /* ── Footer ─────────────────────────────────────────── */
      .app-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 36px;
        z-index: 30;
        background: #1e3a8a;
        display: flex;
        align-items: center;
        justify-content: center;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 0.75rem;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.55);
        letter-spacing: 0.01em;
      }
      .app-footer p,
      .app-footer span {
        margin: 0;
        font-size: inherit;
        font-weight: inherit;
        color: inherit;
      }
      .footer-center {
        flex: 1;
        text-align: center;
      }
      .footer-right {
        position: absolute;
        right: 2rem;
      }
      body.mode-room .app-footer {
        background: #fff;
        border-top: 1px solid #e2e8f0;
        color: #94a3b8;
      }
      /* Réduit la hauteur utile pour inclure le footer 36px + le header 60px */
      .app-main {
        height: calc(100vh - 96px) !important;
      }
    </style>
  </head>
  <body class="text-gray-900">
    <!-- Applique la classe mode-room au body avant le rendu pour éviter le flash de couleur -->
    <script>
      if (localStorage.getItem("avyro_mode") === "room") document.body.classList.add("mode-room");
    </script>

    <!-- ══════════════════════ HEADER ══════════════════════ -->
    <!-- Logo cliquable → retour dashboard + bouton "← Tableau de bord" -->
    <header class="app-header">
      <a href="dashboard.html" class="logo-link">
        <img src="assets/mark-training.svg" alt="" style="height: 28px; width: 28px" />
        Avyro
      </a>
      <a href="dashboard.html" class="hbtn">← Tableau de bord</a>
    </header>

    <!-- ══════════════════════ MAIN ════════════════════════ -->
    <main class="app-main">
      <div class="app-content">
        <h1 class="text-2xl font-bold mb-6">Mon profil</h1>

        <!-- Section compte : PATCH /api/auth/me (pré-rempli par profile.js) -->
        <section class="card mb-6">
          <h2 class="text-lg font-semibold">Compte</h2>
          <form id="user-form" class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
            <label class="text-xs text-gray-500"
              >Prénom <span style="color: #ef4444">*</span
              ><input class="input" name="first_name" required
            /></label>
            <label class="text-xs text-gray-500"
              >Nom <span style="color: #ef4444">*</span
              ><input class="input" name="last_name" required
            /></label>
            <label class="text-xs text-gray-500 sm:col-span-2"
              >Email <span style="color: #ef4444">*</span
              ><input class="input" name="email" type="email" required
            /></label>
            <label class="text-xs text-gray-500 sm:col-span-2"
              >Téléphone <span style="color: #ef4444">*</span
              ><input class="input" name="phone" type="tel" required
            /></label>
            <!-- Champ mot de passe : envoyé uniquement s'il est renseigné -->
            <label class="text-xs text-gray-500 sm:col-span-2"
              >Nouveau mot de passe (laisser vide pour ne pas changer)<input
                class="input"
                name="password"
                type="password"
                minlength="8"
                placeholder="••••••••"
            /></label>
            <p id="user-msg" class="hidden text-sm sm:col-span-2"></p>
            <div class="sm:col-span-2">
              <button class="btn-primary" type="submit">Enregistrer</button>
            </div>
          </form>
        </section>

        <!-- Section invitation : POST /api/companies/me/invite
             Visible uniquement aux admins -->
        <section class="card mb-6" id="invite-section">
          <h2 class="text-lg font-semibold">Inviter un membre</h2>
          <p class="mt-1 text-sm text-gray-500">
            Envoyez un lien d'invitation par email (valable 7 jours).
          </p>
          <form id="invite-form" class="mt-4 flex gap-2">
            <input
              class="input flex-1"
              name="email"
              type="email"
              placeholder="Email du membre à inviter"
              required
            />
            <select class="input" name="role" style="flex: 0 0 auto; width: auto">
              <option value="member">Membre</option>
              <option value="admin">Admin</option>
            </select>
            <button class="btn-primary" type="submit" style="flex: 0 0 auto">Inviter</button>
          </form>
          <p id="invite-msg" class="hidden text-sm mt-2"></p>
        </section>

        <!-- Section structure : PATCH /api/companies/me
             Visible uniquement aux admins (supprimée du DOM par profile.js si role != admin) -->
        <section class="card" id="company-section">
          <h2 class="text-lg font-semibold">Ma structure</h2>
          <form id="company-form" class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
            <label class="text-xs text-gray-500 sm:col-span-2"
              >Nom <span style="color: #ef4444">*</span><input class="input" name="name" required
            /></label>
            <label class="text-xs text-gray-500"
              >Type
              <select class="input" name="kind">
                <option value="pro">Entreprise</option>
                <option value="private">Particulier</option>
              </select>
            </label>
            <label class="text-xs text-gray-500">SIRET<input class="input" name="siret" /></label>
            <label class="text-xs text-gray-500 sm:col-span-2"
              >Email de contact<input class="input" name="contact_email" type="email"
            /></label>
            <p id="company-msg" class="hidden text-sm sm:col-span-2"></p>
            <div class="sm:col-span-2">
              <button class="btn-primary" type="submit">Enregistrer</button>
            </div>
          </form>
        </section>
        <!-- Section RGPD -->
        <section class="card mt-6" style="border-color: #fca5a5">
          <h2 class="text-lg font-semibold">Données personnelles (RGPD)</h2>
          <p class="mt-1 text-sm text-gray-500">
            Conformément au Règlement Général sur la Protection des Données.
          </p>
          <div class="mt-4 flex flex-wrap gap-3">
            <a
              id="btn-export"
              href="#"
              class="hbtn"
              style="
                border-color: #1d4ed8;
                color: #1d4ed8;
                background: #eff6ff;
                text-decoration: none;
              "
              >⬇ Exporter mes données</a
            >
            <button id="btn-delete" class="hbtn" style="border-color: #ef4444; color: #ef4444">
              Supprimer mon compte
            </button>
          </div>
          <p id="rgpd-msg" class="hidden text-sm mt-2"></p>
        </section>
      </div>
    </main>

    <!-- ══════════════════════ FOOTER ══════════════════════ -->
    <footer class="app-footer">
      <!-- mode-desc : rempli par le script inline ci-dessous selon le mode actif -->
      <p id="mode-desc" class="footer-center"></p>
      <span class="footer-right">© 2026 AVYRO. Tous droits réservés.</span>
    </footer>

    <script src="src/api.js"></script>
    <script src="src/profile.js"></script>
    <!-- Affiche le texte descriptif du mode actif dans le footer -->
    <script>
      const _mode = localStorage.getItem("avyro_mode") === "room" ? "room" : "training";
      document.getElementById("mode-desc").textContent =
        _mode === "room"
          ? "Avyro Room — mutualisez vos salles de réunion : proposez vos salles à des entreprises externes."
          : "Avyro Training — mutualisez vos formations : proposez vos places restantes à d'autres entreprises.";
    </script>
  </body>
</html>
