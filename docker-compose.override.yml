# Surcharge dev (chargée automatiquement par `docker compose up`).
# Backend en hot-reload (port interne 8000, non exposé) : tout passe par le 8080.
services:
  backend:
    environment:
      FLASK_ENV: development
      RUN_SCHEDULER: "1"
    command: ["flask", "run", "--host=0.0.0.0", "--port=8000", "--reload"]
    volumes:
      - ./backend:/app
